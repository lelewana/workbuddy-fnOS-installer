name: Build fnOS fpk

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare build environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tar gzip coreutils sed gawk curl python3
          # 兜底：去掉可能的 CRLF，确保 sh 能正常执行
          sed -i 's/\r$//' build.sh make_icons.py 2>/dev/null || true
          chmod +x build.sh

      - name: Build fpk (x86 + arm)
        run: ./build.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fnwb-fpk
          path: |
            dist/*.fpk
            dist/SHA256SUMS
          if-no-files-found: warn

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$VERSION" \
            --notes "fnOS 安装包（x86 + arm 双架构）。安装时从官方地址获取 WorkBuddy 本体，本仓库不包含任何二进制；与 WorkBuddy 官方无隶属关系。" \
            dist/*.fpk dist/SHA256SUMS
